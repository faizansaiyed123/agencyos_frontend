name: Recruiter demo verification

on:
  push:
    branches: [recruiter-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recruiter-demo
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser workspace tests
        run: npm run test:e2e
