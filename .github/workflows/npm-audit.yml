name: One-time npm audit

on:
  push:
    paths:
      - ".audit-trigger"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=moderate
