name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Normalize billing UI formatting on feature branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/billing-credit-refunds-ui'
        run: |
          git fetch origin "${{ github.head_ref }}"
          git switch -C "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          npx prettier --write src/pages/Invoices.tsx
          if ! git diff --quiet -- src/pages/Invoices.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/Invoices.tsx
            git commit -m "style: format invoice billing adjustment UI"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify formatting
        run: npm run format:check
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright browser tests
        run: npm run test:e2e
      - name: Docker build
        run: docker build --tag agencyos-frontend:ci .
