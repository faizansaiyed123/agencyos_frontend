name: One-time dependency refresh

on:
  push:
    paths:
      - ".dependency-refresh-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Refresh supported dependency versions
        run: npm install vite@^6.4.4 @vitejs/plugin-react@^4.3.4 react-router-dom@^6.30.6
      - name: Commit generated lockfile
        run: |
          rm -f .dependency-refresh-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .dependency-refresh-trigger
          git commit -m "chore: refresh frontend dependencies"
          git push
