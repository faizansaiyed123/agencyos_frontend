name: Backend compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/agencyos_backend
          ref: main
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Tests
        working-directory: backend
        run: pytest
      - name: Docker build
        working-directory: backend
        run: docker build --tag agencyos-backend:compat .
